<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 3.0: only Swift's own script runs here; the article's pictures (and any video in it) come from
       its website, as on the page it came from; nothing else loads. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: blob: https: http:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: data: https: http:; frame-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader view</title>
  <link rel="stylesheet" href="../fonts/swift-font.css">
  <link rel="stylesheet" href="view.css">
  <script src="../fonts/swift-font.js"></script>
</head>
<body>
  <div class="bar">
    <a id="original" class="original" href="#">Original page</a>
    <span class="spacer"></span>
    <button id="listen" class="size listen" aria-label="Read aloud">Listen</button>
    <!-- 3.0.4: font, line spacing and page colour, in Swift's panel. -->
    <button id="style" class="size" aria-label="Font and page colour">Aa</button>
    <button id="smaller" class="size" aria-label="Smaller text">A&#8722;</button>
    <button id="bigger" class="size" aria-label="Bigger text">A+</button>
  </div>
  <main>
    <p id="site" class="site"></p>
    <h1 id="title"></h1>
    <p id="byline" class="byline"></p>
    <article id="content"></article>
    <p id="missing" class="missing" hidden>This article is no longer available. Open the original page and choose reader view again.</p>
  </main>
  <!-- While reading aloud: previous and next paragraph, pause, speed, stop. -->
  <div id="player" class="player" hidden>
    <button id="prev" aria-label="Previous paragraph"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M220-280v-400q0-17 11.5-28.5T260-720q17 0 28.5 11.5T300-680v400q0 17-11.5 28.5T260-240q-17 0-28.5-11.5T220-280Zm458-1L430-447q-9-6-13.5-14.5T412-480q0-10 4.5-18.5T430-513l248-166q5-4 11-5t11-1q16 0 28 11t12 29v330q0 18-12 29t-28 11q-5 0-11-1t-11-5Z"/></svg></button>
    <button id="toggle" class="wide" aria-label="Pause">Pause</button>
    <button id="next" aria-label="Next paragraph"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M660-280v-400q0-17 11.5-28.5T700-720q17 0 28.5 11.5T740-680v400q0 17-11.5 28.5T700-240q-17 0-28.5-11.5T660-280Zm-440-35v-330q0-18 12-29t28-11q5 0 11 1t11 5l248 166q9 6 13.5 14.5T548-480q0 10-4.5 18.5T530-447L282-281q-5 4-11 5t-11 1q-16 0-28-11t-12-29Z"/></svg></button>
    <button id="rate" aria-label="Reading speed">1&#215;</button>
    <button id="stop" aria-label="Stop reading aloud"><svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-320v-320q0-33 23.5-56.5T320-720h320q33 0 56.5 23.5T720-640v320q0 33-23.5 56.5T640-240H320q-33 0-56.5-23.5T240-320Z"/></svg></button>
  </div>
  <script src="view.js"></script>
</body>
</html>
