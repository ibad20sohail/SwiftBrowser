<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <!-- 3.0: only Swift's own script runs here; the article's pictures (and any video in it) come from
       its website, as on the page it came from; nothing else loads. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; img-src 'self' data: blob: https: http:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; media-src 'self' blob: data: https: http:; frame-src 'none'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reader view</title>
  <link rel="stylesheet" href="view.css">
</head>
<body>
  <div class="bar">
    <a id="original" class="original" href="#">Original page</a>
    <span class="spacer"></span>
    <button id="listen" class="size listen" aria-label="Read aloud">Listen</button>
    <button id="smaller" class="size" aria-label="Smaller text">A&#8722;</button>
    <button id="bigger" class="size" aria-label="Bigger text">A+</button>
  </div>
  <main>
    <p id="site" class="site"></p>
    <h1 id="title"></h1>
    <p id="byline" class="byline"></p>
    <article id="content"></article>
    <p id="missing" class="missing" hidden>This article is no longer available. Open the original page and choose reader view again.</p>
  </main>
  <!-- While reading aloud: previous and next paragraph, pause, speed, stop. -->
  <div id="player" class="player" hidden>
    <button id="prev" aria-label="Previous paragraph">&#9198;</button>
    <button id="toggle" class="wide" aria-label="Pause">Pause</button>
    <button id="next" aria-label="Next paragraph">&#9197;</button>
    <button id="rate" aria-label="Reading speed">1&#215;</button>
    <button id="stop" aria-label="Stop reading aloud">&#9632;</button>
  </div>
  <script src="view.js"></script>
</body>
</html>
